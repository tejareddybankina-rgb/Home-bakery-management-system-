<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Sweet Home Bakery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div><h1>Sweet Home Bakery</h1><p>Product Management</p></div>
  <nav><a href="index.html">Dashboard</a><a class="active" href="products.html">Products</a><a href="orders.html">Orders</a></nav>
</header>

<main class="container">
  <div class="page-title"><div><h2>Bakery Products</h2><p>Add and manage your menu.</p></div></div>

  <section class="form-card">
    <h3>Add New Product</h3>
    <form id="productForm">
      <div class="form-grid">
        <input id="productName" placeholder="Product name" required>
        <input id="category" placeholder="Category (Cake, Cookie...)" required>
        <input id="price" type="number" min="1" step="0.01" placeholder="Price" required>
        <input id="stock" type="number" min="0" placeholder="Stock quantity" required>
      </div>
      <button type="submit">+ Add Product</button>
    </form>
    <p id="productMessage" class="message"></p>
  </section>

  <section class="table-card">
    <div class="section-heading"><h3>Product List</h3><button class="secondary" onclick="loadProducts()">Refresh</button></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead>
        <tbody id="productTable"></tbody>
      </table>
    </div>
  </section>
</main>
<footer>Home Bakery Management System</footer>
<script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders | Sweet Home Bakery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div><h1>Sweet Home Bakery</h1><p>Order Management</p></div>
  <nav><a href="index.html">Dashboard</a><a href="products.html">Products</a><a class="active" href="orders.html">Orders</a></nav>
</header>

<main class="container">
  <div class="page-title"><div><h2>Customer Orders</h2><p>Track bakery orders and delivery status.</p></div></div>

  <section class="form-card">
    <h3>Create New Order</h3>
    <form id="orderForm">
      <div class="form-grid">
        <input id="customerName" placeholder="Customer name" required>
        <input id="customerPhone" placeholder="Phone number" required>
        <input id="orderProduct" placeholder="Product name" required>
        <input id="quantity" type="number" min="1" placeholder="Quantity" required>
      </div>
      <button type="submit">+ Create Order</button>
    </form>
    <p id="orderMessage" class="message"></p>
  </section>

  <section class="table-card">
    <div class="section-heading"><h3>Order List</h3><button class="secondary" onclick="loadOrders()">Refresh</button></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Product</th><th>Qty</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="orderTable"></tbody>
      </table>
    </div>
  </section>
</main>
<footer>Home Bakery Management System</footer>
<script src="js/app.js"></script>
</body>
</html>
